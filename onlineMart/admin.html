<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <title>SathanaMart - Admin Dashboard</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <h1>SathanaMart</h1>

    <h2>Admin Dashboard</h2>

    <div id="dashboard">

        <div class="card">
            <h3>Total Products</h3>
            <p id="productCount">0</p>
        </div>

        <div class="card">
            <h3>Total Orders</h3>
            <p id="orderCount">0</p>
        </div>

        <div class="card">
            <h3>Total Users</h3>
            <p id="userCount">0</p>
        </div>

    </div>


    <h2>Products</h2>

    <div id="productList">
        <p>Loading products...</p>
    </div>


    <h2>Orders</h2>

    <div id="orderList">
        <p>Loading orders...</p>
    </div>


    <h2>Users</h2>

    <div id="userList">
        <p>Loading users...</p>
    </div>


    <script src="admin.js"></script>

</body>

</html>
