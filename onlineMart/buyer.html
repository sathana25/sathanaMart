<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>SathanaMart - Buyer</title>

    <link
        rel="stylesheet"
        href="buyer.css">

</head>


<body>


    <!-- HEADER -->

    <header class="top-header">

        <h1>🛒 SathanaMart</h1>

        <h2>Buyer Product Browsing</h2>


        <div class="header-buttons">

            <button onclick="goToCart()">
                🛒 Cart
            </button>

            <button onclick="goToWishlist()">
                ❤️ Wishlist
            </button>
            <button onclick="goToOrders()">
                📦 My Orders
            </button>
            <button onclick="logout()" style="background: #e53935;">
                Logout
            </button>

        </div>

    </header>



    <!-- SEARCH -->

    <div class="search-section">

        <input
            type="text"
            id="searchBox"
            placeholder="Search products..."
            onkeyup="filterProducts()">

    </div>



    <!-- CATEGORY NAVIGATION -->

    <div class="category-bar">

        <button
            class="category-btn active"
            onclick="filterCategory('All', this)">

            For You

        </button>


        <button
            class="category-btn"
            onclick="filterCategory('Fashion', this)">

            👕 Fashion

        </button>


        <button
            class="category-btn"
            onclick="filterCategory('Mobile', this)">

            📱 Mobiles

        </button>


        <button
            class="category-btn"
            onclick="filterCategory('Electronics', this)">

            💻 Electronics

        </button>


        <button
            class="category-btn"
            onclick="filterCategory('Accessories', this)">

            🎧 Accessories

        </button>


        <button
            class="category-btn"
            onclick="filterCategory('Beauty', this)">

            💄 Beauty

        </button>


        <button
            class="category-btn"
            onclick="filterCategory('Home', this)">

            🏠 Home

        </button>


        <button
            class="category-btn"
            onclick="filterCategory('Appliances', this)">

            🔌 Appliances

        </button>


        <button
            class="category-btn"
            onclick="filterCategory('Toys', this)">

            🧸 Toys

        </button>


        <button
            class="category-btn"
            onclick="filterCategory('Food', this)">

            🍔 Food

        </button>


        <button
            class="category-btn"
            onclick="filterCategory('Books', this)">

            📚 Books

        </button>


        <button
            class="category-btn"
            onclick="filterCategory('Sports', this)">

            ⚽ Sports

        </button>

    </div>



    <!-- SELECTED CATEGORY -->

    <h2 id="categoryTitle">
        For You
    </h2>



    <!-- PRODUCT LIST -->

    <div id="productList">

        <p>
            Loading products...
        </p>

    </div>



    <!-- ORDER HISTORY -->

   



    <!-- JAVASCRIPT -->

    <script src="buyer.js"></script>


</body>

</html>
