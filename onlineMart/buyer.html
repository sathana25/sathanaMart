<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <title>SathanaMart - Buyer</title>

    <link rel="stylesheet" href="buyer.css">
</head>

<body>

    <h1>SathanaMart</h1>

    <h2>Buyer Product Browsing</h2>

    <!-- Search -->
    <input
        type="text"
        id="searchBox"
        placeholder="Search products..."
        onkeyup="filterProducts()"
    >

    <!-- Category Filter -->
    <select
        id="categoryFilter"
        onchange="filterProducts()"
    >
        <option value="All">All Categories</option>
        <option value="Mobile">Mobile</option>
        <option value="Electronics">Electronics</option>
        <option value="Accessories">Accessories</option>
    </select>

    <!-- Product List -->
    <div id="productList"></div>


    <h2>Shopping Cart</h2>

    <div id="cartList"></div>

    <h3 id="cartTotal">
        Total: ₹0
    </h3>

    <button onclick="placeOrder()">
        Place Order
    </button>


    <h2>Order History</h2>

    <div id="orderList">

        <p>No orders found.</p>

    </div>


    <script src="buyer.js"></script>

</body>

</html>
